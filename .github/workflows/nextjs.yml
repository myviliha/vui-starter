name: Deploy Next.js site to Pages

# Static-exports the backoffice app (apps/backoffice) and deploys it to GitHub
# Pages. In repo Settings → Pages, set Source = "GitHub Actions".
#
# Adapted from GitHub's Next.js template for this repo:
#  - pnpm monorepo (app lives in apps/backoffice), not a root npm/yarn app
#  - custom domain (internal.viliha.com via apps/backoffice/public/CNAME), so we do
#    NOT use configure-pages' `static_site_generator: next` — it injects a
#    basePath that would break every /_next asset on a root custom domain.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/backoffice/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/backoffice/**/*.[jt]s', 'apps/backoffice/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The docs login is off unless both values are present at build time, and
      # they live in .env.local, which is git-ignored. Without this check a
      # missing secret ships the docs wide open and nothing says so.
      - name: Check the docs login is configured
        env:
          DOCS_EMAIL: ${{ secrets.DOCS_EMAIL }}
          DOCS_PASSWORD_HASH: ${{ secrets.DOCS_PASSWORD_HASH }}
        run: |
          if [ -z "$DOCS_EMAIL" ] || [ -z "$DOCS_PASSWORD_HASH" ]; then
            echo "::error::DOCS_EMAIL and DOCS_PASSWORD_HASH must be set as repository secrets, or the deployed docs have no login. Generate the hash with 'pnpm --filter backoffice docs-password' and store it UNESCAPED (a secret is not parsed by dotenv)."
            exit 1
          fi
      # `...` builds the app's workspace dependencies first. @viliha/vui-core
      # and @viliha/vui-theme ship only generated output, which is git-ignored
      # because it comes from packages/ui/src, so a fresh checkout has nothing
      # to import until turbo builds them. `dependsOn: ["^build"]` in turbo.json
      # is what makes the ordering declarative rather than a hand-kept list.
      #
      # The docs credentials are passed here rather than committed: a secret is
      # handed to the process directly, so unlike a .env file it is not parsed by
      # dotenv and the hash goes in unescaped.
      - name: Build with Next.js
        run: pnpm turbo build --filter=backoffice...
        env:
          NEXT_PUBLIC_DOCS_EMAIL: ${{ secrets.DOCS_EMAIL }}
          NEXT_PUBLIC_DOCS_PASSWORD_HASH: ${{ secrets.DOCS_PASSWORD_HASH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/backoffice/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
